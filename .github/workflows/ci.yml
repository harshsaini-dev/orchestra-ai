name: Verify OrchestraAI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --cov=app --cov-fail-under=70
      - run: npm ci
      - run: npm run test:ui
        env:
          ORCHESTRA_PYTHON: python
